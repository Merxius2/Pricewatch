[project]
name = "pricewatch"
version = "0.1.0"
description = "Track product prices with a local LLM and Good Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.4",
]

[project.scripts]
pricewatch = "pricewatch.main:run"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
